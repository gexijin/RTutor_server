# ---------- GLOBAL OPTIONS (unchanged) ----------
worker_processes  auto;

events { worker_connections 2048; }

http {
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 5m;
  sendfile            on;

  # --------------- REDIRECT-ONLY CONFIG ---------------

  ## HTTP  : 80 → 301 → https://datably.ai
  server {
    listen      80;
    server_name chatlize.ai www.chatlize.ai;
    return 301  https://datably.ai$request_uri;
  }

  ## HTTPS : 443 → 301 → https://datably.ai
  server {
    listen              443 ssl http2;
    listen              [::]:443 ssl http2;
    server_name         chatlize.ai www.chatlize.ai;

    # --- SSL settings stay the same so the cert for chatlize.ai is valid ---
    ssl_certificate     /etc/pki/nginx/server.crt;
    ssl_certificate_key /etc/pki/nginx/private/server.key;
    ssl_protocols       TLSv1.2;

    return 301  https://datably.ai$request_uri;
  }
}
