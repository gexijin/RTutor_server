# Number of worker processes.
worker_processes auto;

events {
    worker_connections 2048;
}

http {
    ###########################################################################
    # General settings
    ###########################################################################

    sendfile on;

    client_max_body_size 500m;
    keepalive_timeout 300;

    ###########################################################################
    # SSL settings
    ###########################################################################

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 5m;

    ssl_protocols TLSv1.2 TLSv1.3;

    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    ###########################################################################
    # WebSocket support
    #
    # Use "upgrade" only when the incoming request actually asks for an
    # upgraded connection.
    ###########################################################################

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    ###########################################################################
    # Main RTutor application servers
    #
    # rtutor.ai -> 172.208.56.52:5001-5030
    ###########################################################################

    upstream app_servers {
        # Shiny requires sticky/persistent sessions.
        ip_hash;

        server 172.208.56.52:5001 fail_timeout=2s max_fails=1;
        server 172.208.56.52:5002 fail_timeout=2s max_fails=1;
        server 172.208.56.52:5003 fail_timeout=2s max_fails=1;
        server 172.208.56.52:5004 fail_timeout=2s max_fails=1;
        server 172.208.56.52:5005 fail_timeout=2s max_fails=1;
        server 172.208.56.52:5006 fail_timeout=2s max_fails=1;
        server 172.208.56.52:5007 fail_timeout=2s max_fails=1;
        server 172.208.56.52:5008 fail_timeout=2s max_fails=1;
        server 172.208.56.52:5009 fail_timeout=2s max_fails=1;
        server 172.208.56.52:5010 fail_timeout=2s max_fails=1;
        server 172.208.56.52:5011 fail_timeout=2s max_fails=1;
        server 172.208.56.52:5012 fail_timeout=2s max_fails=1;
        server 172.208.56.52:5013 fail_timeout=2s max_fails=1;
        server 172.208.56.52:5014 fail_timeout=2s max_fails=1;
        server 172.208.56.52:5015 fail_timeout=2s max_fails=1;
        server 172.208.56.52:5016 fail_timeout=2s max_fails=1;
        server 172.208.56.52:5017 fail_timeout=2s max_fails=1;
        server 172.208.56.52:5018 fail_timeout=2s max_fails=1;
        server 172.208.56.52:5019 fail_timeout=2s max_fails=1;
        server 172.208.56.52:5020 fail_timeout=2s max_fails=1;
        server 172.208.56.52:5021 fail_timeout=2s max_fails=1;
        server 172.208.56.52:5022 fail_timeout=2s max_fails=1;
        server 172.208.56.52:5023 fail_timeout=2s max_fails=1;
        server 172.208.56.52:5024 fail_timeout=2s max_fails=1;
        server 172.208.56.52:5025 fail_timeout=2s max_fails=1;
        server 172.208.56.52:5026 fail_timeout=2s max_fails=1;
        server 172.208.56.52:5027 fail_timeout=2s max_fails=1;
        server 172.208.56.52:5028 fail_timeout=2s max_fails=1;
        server 172.208.56.52:5029 fail_timeout=2s max_fails=1;
        server 172.208.56.52:5030 fail_timeout=2s max_fails=1;
    }

    ###########################################################################
    # UIUC application servers
    #
    # uiuc.rtutor.ai -> 172.208.56.52:7001-7030
    ###########################################################################

    upstream subdomain_servers {
        # Shiny requires sticky/persistent sessions.
        ip_hash;

        server 172.208.56.52:7001 fail_timeout=2s max_fails=1;
        server 172.208.56.52:7002 fail_timeout=2s max_fails=1;
        server 172.208.56.52:7003 fail_timeout=2s max_fails=1;
        server 172.208.56.52:7004 fail_timeout=2s max_fails=1;
        server 172.208.56.52:7005 fail_timeout=2s max_fails=1;
        server 172.208.56.52:7006 fail_timeout=2s max_fails=1;
        server 172.208.56.52:7007 fail_timeout=2s max_fails=1;
        server 172.208.56.52:7008 fail_timeout=2s max_fails=1;
        server 172.208.56.52:7009 fail_timeout=2s max_fails=1;
        server 172.208.56.52:7010 fail_timeout=2s max_fails=1;
        server 172.208.56.52:7011 fail_timeout=2s max_fails=1;
        server 172.208.56.52:7012 fail_timeout=2s max_fails=1;
        server 172.208.56.52:7013 fail_timeout=2s max_fails=1;
        server 172.208.56.52:7014 fail_timeout=2s max_fails=1;
        server 172.208.56.52:7015 fail_timeout=2s max_fails=1;
        server 172.208.56.52:7016 fail_timeout=2s max_fails=1;
        server 172.208.56.52:7017 fail_timeout=2s max_fails=1;
        server 172.208.56.52:7018 fail_timeout=2s max_fails=1;
        server 172.208.56.52:7019 fail_timeout=2s max_fails=1;
        server 172.208.56.52:7020 fail_timeout=2s max_fails=1;
        server 172.208.56.52:7021 fail_timeout=2s max_fails=1;
        server 172.208.56.52:7022 fail_timeout=2s max_fails=1;
        server 172.208.56.52:7023 fail_timeout=2s max_fails=1;
        server 172.208.56.52:7024 fail_timeout=2s max_fails=1;
        server 172.208.56.52:7025 fail_timeout=2s max_fails=1;
        server 172.208.56.52:7026 fail_timeout=2s max_fails=1;
        server 172.208.56.52:7027 fail_timeout=2s max_fails=1;

        # NOTE:
        # Your original config has max_fails=2 here rather than 1.
        # Preserved intentionally.
        server 172.208.56.52:7028 fail_timeout=2s max_fails=2;

        server 172.208.56.52:7029 fail_timeout=2s max_fails=1;
        server 172.208.56.52:7030 fail_timeout=2s max_fails=1;
    }

    ###########################################################################
    # Redirect all HTTP requests to HTTPS
    ###########################################################################

    server {
        listen 80;
        listen [::]:80;

        server_name rtutor.ai uiuc.rtutor.ai sd.rtutor.ai;

        return 301 https://$host$request_uri;
    }

    ###########################################################################
    # rtutor.ai
    #
    # IMPORTANT:
    # A certificate for *.rtutor.ai alone does NOT cover rtutor.ai.
    #
    # Therefore this continues to use the original rtutor.ai certificate.
    ###########################################################################

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;

        server_name rtutor.ai;

        ssl_certificate     /etc/pki/nginx/wildcard.crt;
        ssl_certificate_key /etc/pki/nginx/private/wildcard.key;

        location / {
            proxy_pass http://app_servers;

            proxy_http_version 1.1;

            # WebSocket / Shiny support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Forward original request information
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_redirect off;

            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            # Kept ON to preserve your existing application behavior.
            proxy_buffering on;

            proxy_connect_timeout 2s;

            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_timeout 2s;
            proxy_next_upstream_tries 2;
        }
    }

    ###########################################################################
    # uiuc.rtutor.ai
    #
    # Uses the new wildcard certificate.
    ###########################################################################

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;

        server_name uiuc.rtutor.ai;

        ssl_certificate     /etc/pki/nginx/wildcard.crt;
        ssl_certificate_key /etc/pki/nginx/private/wildcard.key;

        location / {
            proxy_pass http://subdomain_servers;

            proxy_http_version 1.1;

            # WebSocket / Shiny support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Forward original request information
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_redirect off;

            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            # Kept ON to preserve your existing application behavior.
            proxy_buffering on;

            proxy_connect_timeout 2s;

            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_timeout 2s;
            proxy_next_upstream_tries 2;
        }
    }

    ###########################################################################
    # sd.rtutor.ai
    #
    # External:
    #     https://sd.rtutor.ai
    #
    # Backend:
    #     http://172.178.114.1:6021
    #
    # Uses the new wildcard certificate.
    ###########################################################################

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;

        server_name sd.rtutor.ai;

        ssl_certificate     /etc/pki/nginx/wildcard.crt;
        ssl_certificate_key /etc/pki/nginx/private/wildcard.key;

        location / {
            proxy_pass http://172.178.114.1:6021;

            proxy_http_version 1.1;

            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Forward original request information
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_redirect off;

            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            proxy_buffering on;

            proxy_connect_timeout 2s;
        }
    }
}